services:
  embedding-lab:
    container_name: cas-haic-embedding-lab
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspaces/embedding-visualization-exercise
    volumes:
      - .:/workspaces/embedding-visualization-exercise
    ports:
      - "127.0.0.1:8888:8888"
    init: true
    command:
      - sh
      - -lc
      - >-
        jupyter lab
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --allow-root
        --IdentityProvider.token=''
        --ServerApp.root_dir=/workspaces/embedding-visualization-exercise
